services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pmis
      POSTGRES_USER: pmis
      POSTGRES_PASSWORD: pmis_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pmis
      RABBITMQ_DEFAULT_PASS: pmis_dev
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
